name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name
        || github.repository }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    release:
        name: Release
        runs-on: [self-hosted, nwnrs, Linux, X64]
        permissions:
            contents: write
            pull-requests: read
            id-token: write
        steps:
            - uses: actions/checkout@v6.0.3
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: ./.github/actions/rust-toolchain

            - name: Run release-plz
              uses: release-plz/action@v0.5
              with:
                  command: release
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_PAT }}

    release-pr:
        name: Release PR
        runs-on: [self-hosted, nwnrs, Linux, X64]
        permissions:
            contents: write
            id-token: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v6.0.3
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: ./.github/actions/rust-toolchain
            - name: Run release-plz
              uses: release-plz/action@v0.5
              with:
                  command: release-pr
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
