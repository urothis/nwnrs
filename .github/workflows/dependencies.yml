name: Dependencies

permissions:
    contents: read

on:
    pull_request:
        paths:
            - "**/Cargo.toml"
            - "deny.toml"
    push:
        paths:
            - "**/Cargo.toml"
            - "deny.toml"
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name
        || github.repository }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    check:
        name: Advisories, bans, licenses, and sources
        runs-on: [self-hosted, nwnrs, Linux, X64]
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  persist-credentials: false
            - name: Check dependency policies
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  command: check
                  command-arguments: advisories bans licenses sources
