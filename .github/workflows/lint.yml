name: Lint
on:
    pull_request:
        branches: [ main ]
env:
    CARGO_TERM_COLOR: always
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name
        || github.repository }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true
jobs:
    lint:
        name: ${{ matrix.name }}
        runs-on:
            [self-hosted, nwnrs, "${{ matrix.os_label }}", "${{ matrix.arch_label }}"]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS ARM64
                      os_label: macOS
                      arch_label: ARM64
                    - name: Linux x86_64
                      os_label: Linux
                      arch_label: X64
                    - name: Linux ARM64
                      os_label: Linux
                      arch_label: ARM64
                    - name: Windows x86_64
                      os_label: Windows
                      arch_label: X64
        steps:
            - uses: actions/checkout@v6.0.3
              with:
                  persist-credentials: false
            - name: Reject proprietary Docker build assets
              shell: bash
              run: |
                  if [[ -e docker/data || -e docker/data.lock ]]; then
                      echo "::error::Prepared proprietary Docker assets must not be committed."
                      exit 1
                  fi
            - uses: ./.github/actions/setup-rust
              with:
                  components: rustfmt, clippy
            - uses: ./.github/actions/rust-lint
