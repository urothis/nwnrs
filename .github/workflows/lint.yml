name: Lint
on:
    pull_request:
        branches: [ main ]
env:
    CARGO_TERM_COLOR: always
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name
        || github.repository }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true
jobs:
    lint:
        name: Linux x86_64
        runs-on: [self-hosted, nwnrs, Linux, X64]
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6.0.3
              with:
                  persist-credentials: false
            - name: Reject proprietary Docker build assets
              shell: sh
              run: |
                  if [ -e docker/data ] || [ -e docker/data.lock ]; then
                      echo "::error::Prepared proprietary Docker assets must not be committed."
                      exit 1
                  fi
            - uses: ./.github/actions/rust-toolchain
              with:
                  components: rustfmt, clippy
            - uses: ./.github/actions/rust-lint
