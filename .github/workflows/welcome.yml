name: Welcome new contributors

# This workflow has write permissions on the repo.
# It must not checkout a PR and run untrusted code!

on:
    pull_request_target:
        types:
            - opened
        branches:
            - "main"

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name
        || github.repository }}-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    welcome:
        runs-on: [self-hosted, nwnrs, Linux, X64]
        permissions:
            pull-requests: write
        steps:
            - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      // Get a list of all issues created by the PR opener
                      // See: https://octokit.github.io/rest.js/#pagination
                      const creator = context.payload.sender.login
                      const opts = github.rest.issues.listForRepo.endpoint.merge({
                        ...context.issue,
                        creator,
                        state: 'all'
                      })
                      const issues = await github.paginate(opts)

                      for (const issue of issues) {
                        if (issue.number === context.issue.number) {
                          continue
                        }

                        if (issue.pull_request) {
                          return // Creator is already a contributor.
                        }
                      }

                      await github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `**Welcome**, new contributor!

                        Please make sure you've read our [contributing guide](https://bevy.org/learn/contribute/introduction), as well as our [policy regarding AI usage](https://bevy.org/learn/contribute/policies/ai/), and we look forward to reviewing your pull request shortly ✨`
                      })
