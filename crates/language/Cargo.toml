[package]
name = "nwnrs-language"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish = true
description = "Persistent compiler-owned language intelligence for NWScript and nwpkg projects"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nwnrs-language"
readme = "README.md"
keywords = ["nwn", "neverwinter-nights", "nwscript", "language-server"]
categories = ["development-tools", "parser-implementations", "game-development"]

[dependencies]
nwnrs-nwpkg = { package = "nwnrs-nwpkg", path = "../nwpkg", version = "0.0.1" }
nwnrs-nwscript = { package = "nwnrs-nwscript", path = "../nwscript", version = "0.0.1" }
nwnrs-runtime = { package = "nwnrs-runtime", path = "../runtime", version = "0.0.1" }
nwnrs-types = { package = "nwnrs-types", path = "../types", version = "0.0.1" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_parser.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
    "-Zunstable-options",
    "--generate-link-to-definition",
    "--generate-macro-expansion",
]
